name: Build Server And Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    
    - name: Build Initializer
      run: go build -o ./initializer ./cmd/initializer

    - name: Build Updater
      run: go build -o ./updater ./cmd/updater

    - name: Build Notifier
      run: go build -o ./notifier ./cmd/notifier

    - name: Build Bot
      run: go build -o ./bot ./cmd/bot

    - name: Image Replaced
      run: go build -o ./image-replacer ./cmd/images

    - name: Upload initializer
      uses: actions/upload-artifact@v4
      with:
        name: initializer
        path: ./initializer
      
    - name: Upload updater
      uses: actions/upload-artifact@v4
      with:
        name: updater
        path: ./updater

    - name: Upload notifier
      uses: actions/upload-artifact@v4
      with:
        name: notifier
        path: ./notifier
    
    - name: Upload Bot
      uses: actions/upload-artifact@v4
      with:
        name: bot
        path: ./bot
    
    - name: Upload Image Replacer
      uses: actions/upload-artifact@v4
      with:
        name: image_replacer
        path: ./image-replacer


  deploy:
    runs-on: ubuntu-latest

    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    # Decrypt secrets only here, right before copying them to the VPS,
    # so they never end up in a downloadable workflow artifact.
    # Checked out into ./src so the repo's bot/ folder doesn't clash with the bot binary.
    - uses: actions/checkout@v4
      with:
        path: src

    - name: Install git-crypt
      run: |
        sudo apt-get update
        sudo apt-get install -y git-crypt

    - name: Unlock encrypted files
      env:
        GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      working-directory: src
      run: |
        test -n "$GIT_CRYPT_KEY"
        key_file="$(mktemp)"
        printf '%s' "$GIT_CRYPT_KEY" | base64 --decode > "$key_file"
        git-crypt unlock "$key_file"
        rm -f "$key_file"

    - name: Download Initializer
      uses: actions/download-artifact@v4
      with: 
        name: initializer

    - name: Download Updater
      uses: actions/download-artifact@v4
      with:
        name: updater 

    - name: Download Notifier
      uses: actions/download-artifact@v4
      with:
        name: notifier 

    - name: Download Bot
      uses: actions/download-artifact@v4
      with:
        name: bot 
    
    - name: Download Image Replacer
      uses: actions/download-artifact@v4
      with:
        name: image_replacer 

    - name: Deploy to VPS
      env:
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
        PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
        
        # Each deploy is uploaded to its own release folder (kept for rollback),
        # then its files are copied into ~/repetition/go. Every file is renamed
        # into place in one step, so a job never finds a binary missing.
        # To roll back on the server, see "Deploy and rollback" in the README.
        RELEASE="${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        ssh -i ~/.ssh/id_rsa $VPS_USER@$VPS_HOST "mkdir -p repetition/releases/$RELEASE"

        scp -p -i ~/.ssh/id_rsa \
        ./updater \
        ./notifier \
        ./initializer \
        ./bot \
        ./image-replacer \
        ./src/secrets.yaml \
        "$VPS_USER@$VPS_HOST:repetition/releases/$RELEASE/"

        ssh -i ~/.ssh/id_rsa $VPS_USER@$VPS_HOST bash -s -- "$RELEASE" <<'REMOTE'
        set -euo pipefail
        RELEASE="$1"
        cd ~/repetition
        chmod +x releases/$RELEASE/updater releases/$RELEASE/notifier releases/$RELEASE/initializer releases/$RELEASE/bot releases/$RELEASE/image-replacer

        mkdir -p go
        for file in updater notifier initializer bot image-replacer secrets.yaml; do
          cp -p "releases/$RELEASE/$file" "go/.$file.new"
          mv -f "go/.$file.new" "go/$file"
        done
        sudo systemctl restart ktor.service

        # Keep the 5 most recent releases for rollback.
        ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf
        REMOTE
